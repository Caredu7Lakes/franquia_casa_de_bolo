version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: casadobolo_postgres
    restart: always
    environment:
      POSTGRES_USER: casadobolo_user
      POSTGRES_PASSWORD: casadobolo_pass
      POSTGRES_DB: casadobolo_db
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: casadobolo_redis
    restart: always
    ports:
      - '6379:6379'

  evolution_api:
    image: evoapicloud/evolution-api:v2.3.7
    container_name: casadobolo_evolution
    restart: always
    ports:
      - '8080:8080'
    environment:
      - SERVER_URL=http://localhost:8080
      - AUTHENTICATION_TYPE=apikey
      - AUTHENTICATION_API_KEY=minha_chave_global_secreta_123
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://postgres:senha@postgres:5432/evolution
      - LOG_LEVEL=ERROR
    volumes:
      - evolution_instances:/rabbitmq/data

volumes:
  pgdata:
  evolution_instances: