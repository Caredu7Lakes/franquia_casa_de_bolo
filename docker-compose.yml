services:
  postgres:
    image: postgres:15-alpine
    container_name: casadobolo_postgres
    restart: always
    environment:
      POSTGRES_USER: casadobolo_user
      POSTGRES_PASSWORD: casadobolo_pass
      # Cria os DOIS bancos na primeira subida (script abaixo).
      POSTGRES_DB: casadobolo_db
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    # Não expomos 5432 para fora da VM: só a rede interna usa.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U casadobolo_user -d casadobolo_db"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: casadobolo_redis
    restart: always
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  evolution_api:
    image: evoapicloud/evolution-api:v2.3.7
    container_name: casadobolo_evolution
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - '127.0.0.1:8080:8080'  # so localhost; QR via tunel SSH
    environment:
      - SERVER_URL=http://evolution_api:8080
      - AUTHENTICATION_TYPE=apikey
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY}
      # Banco próprio da Evolution (usuário/senha do serviço postgres, banco 'evolution').
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://casadobolo_user:casadobolo_pass@postgres:5432/evolution
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://redis:6379/0
      - CACHE_REDIS_PREFIX_KEY=evolution
      - LOG_LEVEL=ERROR
    volumes:
      - evolution_instances:/evolution/instances
    healthcheck:
      # A Evolution expõe a raiz da API; 200 confirma que está servindo.
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8080/ >/dev/null 2>&1 || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 40s

  backend:
    build: .
    container_name: casadobolo_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      evolution_api:
        condition: service_started
    ports:
      # Exposto só no host (localhost) — o acesso público é via Caddy (HTTPS).
      - '127.0.0.1:3000:3000'
    env_file:
      - .env
    environment:
      # Produção: pino emite JSON puro no stdout (sem pino-pretty, que é só dev).
      - NODE_ENV=production
      # Nomes de serviço da rede docker, não localhost.
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=casadobolo_app
      # Senha do role de runtime — vem do .env (mesma usada pela migration RLS).
      - DB_PASS=${APP_DB_PASSWORD}
      - DB_NAME=casadobolo_db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - EVOLUTION_API_URL=http://evolution_api:8080
      - EVOLUTION_API_KEY=${EVOLUTION_API_KEY}
      - EVOLUTION_INSTANCE_NAME=casa_do_bolo_instance
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
      # Mesmo segredo usado pelo relay para assinar os webhooks.
      - WEBHOOK_HMAC_SECRET=${WEBHOOK_HMAC_SECRET}
      - WEBHOOK_HMAC_HEADER=x-signature-256
    healthcheck:
      # Liveness do próprio backend (NestJS /health). node puro, sem dep extra.
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 40s

  # Relay de assinatura: a Evolution não assina os webhooks. Ela aponta para
  # http://webhook_relay:3001/webhook; o relay calcula o HMAC do corpo e repassa
  # ao backend com o header x-signature-256. Só na rede interna (sem portas pra fora).
  webhook_relay:
    build: ./relay
    container_name: casadobolo_relay
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - PORT=3001
      - UPSTREAM_URL=http://backend:3000
      - WEBHOOK_HMAC_SECRET=${WEBHOOK_HMAC_SECRET}
      - WEBHOOK_HMAC_HEADER=x-signature-256
    healthcheck:
      # O relay não tem rota de health; confirmamos que a porta 3001 aceita conexão.
      test: ["CMD", "node", "-e", "require('net').connect(3001,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Reverse proxy público (HTTPS automático) + SPA do painel. Único serviço com
  # portas públicas (80/443). Builda o frontend e serve os estáticos, termina o
  # TLS e faz o proxy da API para o backend na rede interna.
  caddy:
    build:
      context: .
      dockerfile: caddy/Dockerfile
    container_name: casadobolo_caddy
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - '80:80'
      - '443:443'
    environment:
      - DOMAIN=${DOMAIN}
      - ACME_EMAIL=${ACME_EMAIL}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      # A :80 devolve 308 (redirect p/ HTTPS) e o admin :2019 não está exposto,
      # então checamos só se a porta 80 aceita conexão (processo vivo), sem
      # seguir o redirect nem tocar no TLS. nc existe no caddy:2-alpine.
      test: ["CMD-SHELL", "nc -z localhost 80 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  pgdata:
  redisdata:
  evolution_instances:
  caddy_data:
  caddy_config:
